<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive Images practice for WDD 131">
    <meta name="author" content="Moroni Balarezo">

    <title>Responsive Images</title>

    <link rel="stylesheet" href="styles/responsive-images.css">
</head>

<body>

    <header>
        <h1>Responsive Images</h1>
    </header>

    <main>

        <picture>
            <source media="(min-width: 1000px)"
                srcset="images/hero-large.webp">

            <source media="(min-width: 500px)"
                srcset="images/hero-medium.webp">

            <img
                src="images/hero-small.webp"
                alt="Landscape example"
                width="500"
                height="250">
        </picture>

    </main>

</body>

</html>
