<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Country page about Ecuador created by Moroni Balarezo for WDD 131.">

    <meta name="author" content="Moroni Balarezo">

    <title>Ecuador | WDD 131</title>

    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Ecuador</h1>
    </header>

    <main>

        <picture class="hero">
            <source
                srcset="images/ecuador-large.webp"
                media="(min-width: 800px)">

            <img
                src="images/ecuador-small.webp"
                alt="Landscape of Ecuador">
        </picture>

        <section class="data">
            <h2>Data</h2>

            <p><strong>Area:</strong> 283,561 km²</p>
            <p><strong>Population:</strong> 18 million</p>
            <p><strong>Capital:</strong> Quito</p>
            <p><strong>Languages:</strong> Spanish</p>
            <p><strong>Currency:</strong> US Dollar</p>
            <p><strong>Time Zone:</strong> UTC−5</p>
            <p><strong>Calling Code:</strong> +593</p>
            <p><strong>Internet TLD:</strong> .ec</p>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <img
                class="weather-icon"
                src="images/weather.svg"
                alt="Weather icon">

            <p><strong>Temperature:</strong> <span id="temperature">8</span> °C</p>

            <p><strong>Conditions:</strong> Partly Cloudy</p>

            <p><strong>Wind:</strong> <span id="wind-speed">10</span> km/h</p>

            <p>
                <strong>Wind Chill:</strong>
                <span id="wind-chill"></span>
            </p>
        </section>

    </main>

    <footer>
        <p>
            ©<span id="currentyear"></span>
            🌎 Moroni Balarezo 🌎 Ecuador
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
